[project]
name = "tiquette"
version = "0.3.1"
description = "Minimal file-based ticket system with dependency tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tq = "tiquette.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.2.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

[tool.bumpversion]
current_version = "0.3.1"
commit = true
tag = true
tag_name = "v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/tiquette/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## v{new_version} – {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = ".claude-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# The lock file records this project's own version. If bump-my-version does not
# update it in the same commit, the next `uv` command rewrites uv.lock and makes
# the tree dirty, which blocks the following bump (allow_dirty = false).
# The pattern is anchored on the package name, because a bare version line
# matches other packages in the lock file too.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = 'name = "tiquette"\nversion = "{current_version}"'
replace = 'name = "tiquette"\nversion = "{new_version}"'
regex = true
